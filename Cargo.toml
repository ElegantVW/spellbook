[package]
name = "spellbook"
version = "0.2.0"
edition = "2021"
description = "faeOS terminal file manager"
license = "MIT"
publish = false

[[bin]]
name = "spellbook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
